[idle_timeout]
gcode:
    M117 "Idle Triggered"
    LED_IDLE
    TURN_OFF_HEATERS
    TURN_OFF_NEVERMORE
    UPDATE_DELAYED_GCODE ID=delayed_idle DURATION=60
timeout: 300

[delayed_gcode delayed_idle]
initial_duration: 0.
gcode:
  {% if printer.idle_timeout.state == "Idle" %}
    M117 Idle
    M84
  {% endif %}

